<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>厂商激活码工具</title>
<style>
:root{font-family:'Microsoft YaHei UI','Segoe UI',sans-serif;color:#273347;background:#f3f5f8;color-scheme:light}*{box-sizing:border-box}body{margin:0}main{max-width:780px;margin:30px auto;padding:0 22px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:22px;margin:0}header p{color:#7b8798;font-size:12px;margin:7px 0 0}.badge{border:1px solid #cbe5d6;border-radius:999px;padding:7px 12px;font-size:12px;color:#26714b;background:#edf8f0}.card{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:22px;margin-top:16px;box-shadow:0 8px 30px #25334a05}.key-row,.actions,.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px}h2{font-size:15px;margin:0}.muted{font-size:12px;color:#7b8798}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px;margin-top:18px}label{display:grid;gap:7px;font-size:12px;color:#53627a}.wide{grid-column:1/-1}input,textarea{width:100%;min-width:0;border:1px solid #d5ddea;background:#fafbfd;border-radius:7px;padding:10px 11px;font:inherit;color:#25344c}input:focus,textarea:focus{outline:2px solid #c2d4ff;border-color:#7096ed}button,a.download{border:1px solid #d2dced;border-radius:7px;padding:9px 14px;background:#fff;color:#3263b9;font:inherit;font-size:12px;cursor:pointer;text-decoration:none}button.primary{background:#2f67e9;color:#fff;border-color:#2f67e9}button:disabled{opacity:.5;cursor:default}.actions{justify-content:flex-end;margin-top:20px}.message{color:#b33644;font-size:12px;min-height:18px;margin:12px 0 0}.message.ok{color:#257449}textarea{font:11px/1.6 Consolas,monospace;resize:vertical;min-height:125px;margin-top:12px}.result-head{margin-top:20px}details{margin-top:12px;font-size:12px;color:#788498}code{overflow-wrap:anywhere;display:block;margin-top:10px}label.inline{display:flex;align-items:center;gap:8px}label.inline input{width:auto}.key-row button{flex-shrink:0}[hidden]{display:none!important}@media(max-width:560px){main{padding:0 12px;margin-top:18px}.card{padding:17px}.form-grid{grid-template-columns:1fr}.key-row{align-items:flex-start}header{gap:12px}}
</style></head><body><main>
<header><div><h1>厂商激活码工具</h1><p>仅厂商保管，勿随客户安装包分发</p></div><span id="keyStatus" class="badge">读取中</span></header>
<section class="card"><div class="key-row"><div><h2>签发身份</h2><p id="keyHint" class="muted">首次使用初始化一次，之后沿用同一密钥。</p></div><button id="initialize" type="button">初始化密钥</button></div><details><summary>公钥信息</summary><code id="keyFingerprint"></code><code id="keyFile"></code></details></section>
<section class="card"><h2>生成激活码</h2><form id="licenseForm"><div class="form-grid">
<label class="wide">本机指纹<input name="machineId" required pattern="machine-[a-f0-9]{32}" placeholder="粘贴客户提供的完整指纹"></label>
<label>客户名称<input name="customer" required maxlength="120" placeholder="客户或工厂名称"></label>
<label>许可证编号<input name="licenseId" required maxlength="120"></label>
<label>生效时间<input name="issuedAt" type="datetime-local" required></label>
<label id="expiryField">到期时间<input name="expiresAt" type="datetime-local" required></label>
<label class="inline wide"><input id="perpetual" type="checkbox">永久授权</label>
</div><div class="actions"><button class="primary" id="generate" type="submit" disabled>生成激活码</button></div></form>
<p id="message" class="message" role="status"></p>
<div id="result" hidden><div class="result-head"><h2>激活码</h2><div><a class="download" id="download">下载 TXT</a> <button id="copyCode" type="button">复制激活码</button></div></div><textarea id="code" readonly aria-label="生成的激活码" spellcheck="false"></textarea></div>
</section></main><script>
const $=id=>document.getElementById(id),token=new URLSearchParams(location.search).get('token');
async function api(route,data){const url=new URL(route,location.origin);url.searchParams.set('token',token||'');const response=await fetch(url,{...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{})});const value=await response.json();if(!response.ok)throw new Error(value.error||'操作失败');return value}
function message(text,ok=false){$('message').textContent=text;$('message').className='message'+(ok?' ok':'')}
function renderKeys(data){const ready=data.privateKeyPresent&&data.publicKeyPresent;$('keyStatus').textContent=ready?'签发就绪':'未初始化';$('initialize').disabled=data.privateKeyPresent||data.publicKeyPresent;$('generate').disabled=!ready;$('keyHint').textContent=ready?'签发身份已保存，请离线备份私钥。':'首次使用初始化一次，之后沿用同一密钥。';$('keyFingerprint').textContent=data.publicKeyFingerprint||'—';$('keyFile').textContent=data.publicKeyFile||''}
$('initialize').onclick=async()=>{const button=$('initialize');button.disabled=true;try{renderKeys(await api('/api/generate-keys',{}));message('签发身份已初始化，请备份私钥。',true)}catch(e){message(e.message);await refresh()}};
async function refresh(){try{renderKeys(await api('/api/status'))}catch(e){message(e.message)}}
$('perpetual').onchange=()=>{const expiry=document.querySelector('[name="expiresAt"]');expiry.disabled=$('perpetual').checked;expiry.required=!$('perpetual').checked};
$('licenseForm').onsubmit=async event=>{event.preventDefault();const button=$('generate');if(button.disabled)return;button.disabled=true;try{const input=Object.fromEntries(new FormData(event.currentTarget));const data=await api('/api/sign',{...input,issuedAt:new Date(input.issuedAt).toISOString(),expiresAt:$('perpetual').checked?'9999-12-31T23:59:59.000Z':new Date(input.expiresAt).toISOString(),features:['dashboard']});$('code').value=data.activationCode;$('result').hidden=false;$('download').href='/api/download?token='+encodeURIComponent(token||'')+'&file='+encodeURIComponent(data.fileName.replace(/\.json$/,'.txt'));message('已生成并保存',true)}catch(e){message(e.message)}finally{button.disabled=false}};
$('copyCode').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);message('激活码已复制',true)}catch{$('code').focus();$('code').select();message('请按 Ctrl+C 复制')}};
const now=new Date(Date.now()-60000),later=new Date(Date.now()+365*86400000),local=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);
document.querySelector('[name="issuedAt"]').value=local(now);document.querySelector('[name="expiresAt"]').value=local(later);document.querySelector('[name="licenseId"]').value='LIC-'+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+crypto.randomUUID().slice(0,8).toUpperCase();refresh();
</script></body></html>
