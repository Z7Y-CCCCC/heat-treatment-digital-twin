<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>部署与连接</title>
  <style>
    :root {
      --bg: #f4f4f6;
      --card: #ffffff;
      --card-2: #f9f9fb;
      --pill: #f1f1f4;
      --pill-hover: #e7e7ed;
      --line: #e3e3e8;
      --line-2: #ececf0;
      --fg: #1c1c21;
      --fg-2: #4b4b53;
      --ctl-fg: #63636b;
      --muted: #85858d;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eeedfd;
      --green: #189a58;
      --green-soft: #e4f6ec;
      --red: #d64545;
      --red-soft: #fbe9e9;
      --amber: #b45309;
      --amber-soft: #fbf0df;
      --shadow-sm: 0 1px 2px rgba(20, 22, 30, 0.04);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
      --code: "Cascadia Code", "JetBrains Mono", ui-monospace, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      padding: 24px 28px 26px;
    }

    .shell {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 顶部标题区 */
    .page-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 2px 2px 4px;
    }

    .head-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      display: grid;
      place-items: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .head-mark svg {
      width: 18px;
      height: 18px;
    }

    .page-head h1 {
      font-size: 19px;
      font-weight: 650;
      letter-spacing: -0.015em;
      color: var(--fg);
      line-height: 1.3;
    }

    .page-head p {
      margin-top: 4px;
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* 卡片容器 */
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
    }

    .field-group + .field-group {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line-2);
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--fg-2);
      margin-bottom: 7px;
    }

    select, input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card-2);
      color: var(--fg);
      font-family: var(--font);
      font-size: 13px;
      outline: none;
      transition: border-color 120ms ease, background-color 120ms ease, box-shadow 120ms ease;
    }

    input[type="url"] {
      font-family: var(--code);
      font-variant-numeric: tabular-nums;
    }

    select:focus, input:focus {
      border-color: var(--accent);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    small {
      display: block;
      margin-top: 7px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    #remote[hidden] {
      display: none;
    }

    /* 健康检测卡片 */
    .connection-panel {
      margin-top: 14px;
      padding: 18px 20px;
    }

    .connection-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .connection-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .connection-heading h2 {
      font-size: 14px;
      font-weight: 630;
      color: var(--fg);
    }

    .state-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }

    .connection-panel[data-state="online"] .state-dot {
      background: var(--green);
      box-shadow: 0 0 0 3px var(--green-soft);
    }

    .connection-panel[data-state="checking"] .state-dot {
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .connection-panel[data-state="simulation"] .state-dot {
      background: var(--amber);
      box-shadow: 0 0 0 3px var(--amber-soft);
    }

    .connection-panel[data-state="offline"] .state-dot,
    .connection-panel[data-state="wrong-service"] .state-dot,
    .connection-panel[data-state="invalid"] .state-dot,
    .connection-panel[data-state="degraded"] .state-dot {
      background: var(--red);
      box-shadow: 0 0 0 3px var(--red-soft);
    }

    #checkConnection {
      height: 29px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--fg-2);
      font-family: var(--font);
      font-size: 12px;
      font-weight: 550;
      cursor: pointer;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    #checkConnection:hover {
      background: var(--pill);
      color: var(--fg);
    }

    .connection-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-box {
      background: var(--card-2);
      border: 1px solid var(--line-2);
      border-radius: 10px;
      padding: 11px 12px;
    }

    .connection-grid dt {
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 550;
      margin-bottom: 6px;
    }

    .connection-grid dd {
      font-weight: 620;
      font-size: 13px;
      line-height: 1.45;
      color: var(--fg);
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .connection-panel[data-state="online"] #transport,
    .connection-panel[data-state="online"] #collection {
      color: var(--green);
    }

    .connection-panel[data-state="offline"] #transport,
    .connection-panel[data-state="wrong-service"] #transport,
    .connection-panel[data-state="invalid"] #transport {
      color: var(--red);
    }

    .connection-panel[data-state="simulation"] #collection {
      color: var(--amber);
    }

    .connection-panel[data-state="simulation"] #transport,
    .connection-panel[data-state="degraded"] #transport {
      color: var(--green);
    }

    .connection-panel[data-state="degraded"] #collection {
      color: var(--red);
    }

    #displayLink[data-state="online"] {
      color: var(--green);
    }

    #displayLink[data-state="offline"] {
      color: var(--amber);
    }

    #displayLink[data-state="stale"] {
      color: var(--red);
    }

    #displayLink[data-state="unknown"] {
      color: var(--muted);
    }

    .health-meta {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--line-2);
    }

    #healthNote {
      font-size: 12px;
      color: var(--fg-2);
      line-height: 1.6;
    }

    #healthChecked {
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* 底部操作栏 */
    #error {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: var(--red-soft);
      color: var(--red);
      font-size: 12px;
      white-space: pre-wrap;
    }

    #error:empty {
      display: none;
    }

    .footer-bar {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .footer-note {
      margin-top: 0;
      font-size: 12px;
      color: var(--muted);
    }

    #save {
      height: 36px;
      padding: 0 20px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #ffffff;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 580;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 120ms ease, transform 80ms ease, opacity 120ms ease;
    }

    #save:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    #save:active:not(:disabled) {
      transform: scale(0.985);
    }

    #save:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="page-head">
      <div class="head-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
          <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>部署与连接</h1>
        <p>大屏（含后台管理）负责展示与配置；采集运行中心管理独立的开机采集服务。本窗口只设置大屏连接，不安装或控制采集服务。</p>
      </div>
    </header>

    <form id="form">
      <section class="panel">
        <div class="field-group">
          <label for="mode">连接方式</label>
          <select id="mode">
            <option value="display">独立展示（不进行 PLC 采集）</option>
            <option value="client">连接独立采集服务（本机或远程）</option>
          </select>
        </div>

        <div id="remote" class="field-group">
          <label for="backendOrigin">数据服务地址</label>
          <input id="backendOrigin" type="url" value="http://127.0.0.1:3001" placeholder="http://127.0.0.1:3001">
          <small>连接已安装的本机或远程数据服务。断开时不会自动切换数据库或模拟数据。</small>
        </div>
      </section>

      <section id="connectionHealth" class="panel connection-panel" role="status" aria-label="大屏与采集服务连接健康" data-state="checking">
        <div class="connection-heading">
          <div class="connection-title-wrap">
            <span class="state-dot" aria-hidden="true"></span>
            <h2>大屏 ↔ 采集服务</h2>
          </div>
          <button id="checkConnection" type="button">重新检测</button>
        </div>

        <dl class="connection-grid">
          <div class="metric-box">
            <dt>采集服务</dt>
            <dd id="transport">正在检测…</dd>
          </div>
          <div class="metric-box">
            <dt>服务端大屏实时通道</dt>
            <dd id="displayLink">等待检测</dd>
          </div>
          <div class="metric-box">
            <dt>采集 / 数据状态</dt>
            <dd id="collection">等待检测</dd>
          </div>
        </dl>

        <div class="health-meta">
          <div id="healthNote">只读检测，不安装或控制服务；接口可达不等于采集正常。</div>
          <div id="healthChecked"></div>
        </div>
      </section>

      <div id="error" role="alert"></div>

      <div class="footer-bar">
        <small class="footer-note">保存后仅重启展示程序。切换数据服务前，请先备份当前工程。</small>
        <div class="actions">
          <button id="save" type="submit">保存并重启大屏</button>
        </div>
      </div>
    </form>
  </div>

  <script src="./deployment.js"></script>
</body>
</html>
