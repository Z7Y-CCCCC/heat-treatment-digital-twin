<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>采集服务连接</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#f4f6fa;color:#233047;font:14px "Microsoft YaHei",sans-serif}h1{font-size:23px;margin:0 0 12px}p{color:#718096;line-height:1.8;margin:0 0 23px}.panel{padding:23px;border:1px solid #d8e0ed;border-radius:12px;background:white}label{display:block;margin-bottom:10px}input{width:100%;padding:12px;border:1px solid #cbd5e5;border-radius:7px;font:inherit}small{display:block;color:#78859b;line-height:1.8;margin-top:12px}.actions{display:flex;justify-content:flex-end;margin-top:25px}button{border:0;border-radius:8px;background:#356be7;color:white;padding:12px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#error{color:#ba3845;white-space:pre-wrap;margin-top:16px}
</style></head><body><h1>采集服务连接</h1><p>前端只负责展示。Windows 采集服务在电脑开机后自动运行，不需要登录桌面，关闭 Unity 不会停止采集。</p><form id="form"><section class="panel"><label for="backendOrigin">本机采集服务地址</label><input id="backendOrigin" type="url" required value="http://127.0.0.1:3001"><small>同一台现场电脑默认使用 127.0.0.1。服务由安装包注册；修改这里不会安装或停止服务，也不会让前端读取 PLC。若服务未运行，请在 Windows“服务”中检查 HeatTreatmentCollector。</small></section><small>保存后仅重启展示程序；采集服务和数据库继续运行。</small><div id="error" role="alert"></div><div class="actions"><button id="save">保存并重启前端</button></div></form><script src="./deployment.js"></script></body></html>
