<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
<title>部署与连接</title><style>
*{box-sizing:border-box}body{margin:0;padding:36px;background:#f4f6fa;color:#233047;font:14px "Microsoft YaHei",sans-serif}h1{font-size:23px;margin:0 0 12px}p{color:#718096;line-height:1.8;margin:0 0 23px}.panel{padding:23px;border:1px solid #d8e0ed;border-radius:12px;background:white}label{display:block;margin-bottom:10px}select{font:inherit;padding:10px;border:1px solid #cbd5e5;border-radius:7px;width:100%;margin-bottom:20px}input{width:100%;padding:12px;border:1px solid #cbd5e5;border-radius:7px;font:inherit}small{display:block;color:#78859b;line-height:1.8;margin-top:12px}.actions{display:flex;justify-content:flex-end;margin-top:25px}button{border:0;border-radius:8px;background:#356be7;color:white;padding:12px 24px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#error{color:#ba3845;white-space:pre-wrap;margin-top:16px}
.connection-panel{margin-top:16px;padding:18px}.connection-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.connection-heading h2{font-size:16px;margin:0}.connection-heading button{padding:6px 12px;font-size:12px;color:#356be7;background:#eef3ff}.connection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.connection-grid dt{color:#78859b;font-size:12px;margin-bottom:7px}.connection-grid dd{margin:0;font-weight:600;line-height:1.6;font-size:13px;overflow-wrap:anywhere}.connection-panel dl{margin:0}.connection-panel[data-state=online] #transport,.connection-panel[data-state=online] #collection{color:#247251}.connection-panel[data-state=offline] #transport,.connection-panel[data-state=wrong-service] #transport,.connection-panel[data-state=invalid] #transport{color:#ba3845}.connection-panel[data-state=simulation] #collection{color:#946319}#healthNote{font-size:12px;margin-top:13px;color:#718096;line-height:1.7}#healthChecked{font-size:12px;color:#78859b;margin-top:8px}body{padding:28px 32px}
.connection-panel[data-state=simulation] #transport,.connection-panel[data-state=degraded] #transport,#displayLink[data-state=online]{color:#247251}#displayLink[data-state=offline]{color:#946319}#displayLink[data-state=stale],.connection-panel[data-state=degraded] #collection{color:#ba3845}#displayLink[data-state=unknown]{color:#78859b}
</style></head><body><h1>部署与连接</h1><p>大屏（含后台管理）负责展示与配置；采集运行中心管理独立的开机采集服务。本窗口只设置大屏连接，不安装或控制采集服务。</p><form id="form"><section class="panel"><label for="mode">连接方式</label><select id="mode"><option value="display">独立展示（不进行 PLC 采集）</option><option value="client">连接独立采集服务（本机或远程）</option></select><div id="remote"><label for="backendOrigin">数据服务地址</label><input id="backendOrigin" type="url" value="http://127.0.0.1:3001"><small>连接已安装的本机或远程数据服务。断开时不会自动切换数据库或模拟数据。</small></div></section>
<section id="connectionHealth" class="panel connection-panel" role="status" aria-label="大屏与采集服务连接健康" data-state="checking"><div class="connection-heading"><h2>大屏 ↔ 采集服务</h2><button id="checkConnection" type="button">重新检测</button></div><dl class="connection-grid"><div><dt>采集服务</dt><dd id="transport">正在检测…</dd></div><div><dt>服务端大屏实时通道</dt><dd id="displayLink">等待检测</dd></div><div><dt>采集 / 数据状态</dt><dd id="collection">等待检测</dd></div></dl><div id="healthNote">只读检测，不安装或控制服务；接口可达不等于采集正常。</div><div id="healthChecked"></div></section>
<small>保存后仅重启展示程序。切换数据服务前，请先备份当前工程。</small><div id="error" role="alert"></div><div class="actions"><button id="save">保存并重启大屏</button></div></form><script src="./deployment.js"></script></body></html>
