<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>热处理数字孪生大屏 - 正在启动</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--startup-background,#f5f7fb); }
    body { display: grid; place-items: center; padding: 18px; color: #1d2939; -webkit-app-region: drag; user-select: none; }
    /* Native window drag on the background; controls and copyable text stay interactive. */
    button, input, textarea, select, a, #title, #detail, .failure, #activationPanel { -webkit-app-region: no-drag; user-select: text; }
    button { user-select: none; }
    body.launch-status { padding: 0; }
    .shell {
      width: min(900px, 100%); max-height: calc(100vh - 48px); padding: 28px 34px 24px;
      border: 1px solid #dbe4f2; border-radius: 13px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(42,72,125,.08);
      display: flex; flex-direction: column;
    }
    .brand { display: flex; align-items: center; gap: 12px; color: #54709a; }
    .brand img { width: 22px; height: 22px; object-fit: contain; }
    .brand h1 { margin: 0; font-size: 10px; font-weight: 600; letter-spacing: .17em; }
    .brand p { margin: 0 0 0 auto; color: #71819b; font-size: 9px; letter-spacing: .12em; }
    .brand p::before { content: '•'; margin-right: 7px; color: #2563eb; }
    .progress-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 12px; }
    #title { font-size: 17px; font-weight: 500; line-height: 1.4; }
    #detail { min-height: 20px; margin-top: 7px; color: #667085; font-size: 11px; line-height: 1.55; }
    .failure { display: none; margin-top: 14px; padding: 12px 14px; border: 1px solid #fecdca; border-radius: 9px; background: #fff4f3; }
    .failure strong { display: block; color: #b42318; font-size: 12px; margin-bottom: 5px; }
    #error { color: #b42318; font-size: 12px; line-height: 1.45; max-height: 64px; overflow: auto; }
    #logPath { margin-top: 5px; color: #8e5a55; font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: none; justify-content: flex-end; gap: 8px; margin-top: 13px; }
    .button { min-width: 84px; padding: 8px 14px; border: 1px solid #cfdbef; border-radius: 7px; color: #315b9f; background: #f8faff; font: inherit; font-size: 12px; cursor: pointer; }
    .button:hover { filter: brightness(.97); }
    .button.primary { color: #ffffff; background: #2563eb; border-color: #2563eb; }
    body.error .failure, body.error .actions { display: flex; }
    body.error .failure { flex-direction: column; }
    body.launch-status .shell { width: 100%; height: 100%; max-height: none; padding: 21px 23px 18px; border: 0; border-radius: 0; box-shadow: none; }
    body.launch-status .brand { gap: 9px; }
    body.launch-status .brand img { width: 19px; height: 19px; }
    body.launch-status .brand h1 { font-size: 9px; letter-spacing: .14em; }
    body.launch-status .brand p { font-size: 8px; }
    body.launch-status .progress-head { margin-top: 19px; }
    body.launch-status #title { font-size: 16px; font-weight: 600; }
    body.launch-status #detail { margin-top: 7px; min-height: 0; font-size: 11px; }
    body.launch-status #elapsed { display: block; margin-top: auto; padding-top: 10px; color: #7b8ba3; font-size: 9px; letter-spacing: .06em; }
    body.error #elapsed { display: none; }
    body.error .shell { width: 100%; max-height: 100%; overflow-y: auto; }
    body.error .progress-head { margin-top: 22px; }
    #title, #detail, #error { overflow-wrap: anywhere; }
    .actions { flex-wrap: wrap; }
    [hidden] { display: none !important; }
    body.activating { padding: 24px; }
    body.activating .shell { max-height: 100%; overflow-y: auto; padding: 26px; }
    body.activating #elapsed { display: none; }
    .activation-art { height: 4px; margin: 22px 0; overflow: hidden; border-radius: 99px; background: #e6edfa; }
    .activation-art::after { content: ''; display: block; height: 100%; width: 35%; border-radius: inherit; background: #2563eb; animation: waiting 2.8s ease-in-out infinite alternate; }
    @keyframes waiting { to { transform: translateX(185%); } }
    .activation-label { display: block; margin: 15px 0 7px; font-size: 12px; color: #475467; }
    .fingerprint-row { display: flex; gap: 10px; }
    #fingerprint,#activationCode { min-width: 0; width: 100%; padding: 11px; border: 1px solid #cfdbef; border-radius: 7px; background: #ffffff; color: #1d2939; font: 12px/1.6 Consolas, 'Microsoft YaHei', monospace; }
    #activationCode { resize: none; height: 96px; }
    #activationError { min-height: 22px; margin: 10px 0; color: #b42318; font-size: 12px; }
    .activation-actions { display: flex; justify-content: flex-end; gap: 10px; }
    .button:disabled { opacity: .5; cursor: default; }
    .button:focus-visible,#activationCode:focus-visible { outline: 2px solid #2563eb; outline-offset: 3px; }
    @media(prefers-reduced-motion:reduce) { .activation-art::after { animation: none; } }
    html[data-theme="dark"]{color-scheme: dark}
html[data-theme="dark"],html[data-theme="dark"] body{background: var(--startup-background,#29292c)}
html[data-theme="dark"] body{color: #eeeeea}
html[data-theme="dark"] .shell{border: 1px solid rgba(206, 207, 195, .13);background: linear-gradient(145deg, rgba(49,49,52,.98), rgba(38,38,41,.99))}
html[data-theme="dark"] .brand{color: #b8b9b2}
html[data-theme="dark"] .brand p{color: #92938d}
html[data-theme="dark"] .brand p::before{color: #91b4a3}
html[data-theme="dark"] #detail{color: #9c9d96}
html[data-theme="dark"] .failure{border: 1px solid rgba(235,131,116,.35);background: rgba(127,41,35,.15)}
html[data-theme="dark"] .failure strong{color: #f1afa1}
html[data-theme="dark"] #error{color: #f3c7bd}
html[data-theme="dark"] #logPath{color: #b4918d}
html[data-theme="dark"] .button{border: 1px solid rgba(206,207,195,.19);color: #e8e8e2;background: #3e3f40}
html[data-theme="dark"] .button.primary{color: #242623;background: #b4c8b5}
html[data-theme="dark"] body.launch-status .shell{border: 0}
html[data-theme="dark"] body.launch-status #elapsed{color: #777f79}
html[data-theme="dark"] .activation-art{background: #464946}
html[data-theme="dark"] .activation-art::after{background: #a8c3b1}
html[data-theme="dark"] .activation-label{color: #c9cec8}
html[data-theme="dark"] #fingerprint,html[data-theme="dark"] #activationCode{border: 1px solid #5e655e;background: #222623;color: #eff2ee}
html[data-theme="dark"] #activationError{color: #f1afa1}
html[data-theme="dark"] .button:focus-visible,html[data-theme="dark"] #activationCode:focus-visible{outline: 2px solid #a8c3b1}
  </style>
</head>
<body class="launch-status">
  <main class="shell">
    <header class="brand">
      <img src="./icon.png" alt="">
      <h1>HEAT TREATMENT / DIGITAL TWIN</h1>
      <p id="subtitle">SYSTEM STARTUP</p>
    </header>
    <div class="progress-head"><span id="title">正在准备启动环境</span></div>
    <div id="detail">正在检查程序组件</div>
    <section id="activationPanel" aria-label="软件激活" hidden>
      <div class="activation-art" aria-hidden="true"></div>
      <label class="activation-label" for="fingerprint">本机指纹</label>
      <div class="fingerprint-row"><input id="fingerprint" readonly><button id="copyFingerprint" class="button">复制指纹</button></div>
      <form id="activationForm">
        <label class="activation-label" for="activationCode">激活码</label>
        <textarea id="activationCode" spellcheck="false" maxlength="16384" placeholder="粘贴厂商提供的激活码" required></textarea>
        <div id="activationError" role="alert"></div>
        <div class="activation-actions"><button type="button" class="button" data-action="exit">退出</button><button id="activateButton" class="button primary" type="submit">激活并继续</button></div>
      </form>
    </section>
    <div id="elapsed" aria-live="off">启动准备 · 已等待 0 秒</div>
    <section class="failure">
      <strong>失败原因</strong>
      <div id="error"></div>
      <div id="logPath"></div>
    </section>
    <div class="actions">
      <button class="button" data-action="open-log">打开日志</button>
      <button class="button" data-action="configure">部署与连接</button>
      <button class="button" data-action="collector-center">采集运行中心</button>
      <button class="button primary" data-action="restart">重新启动</button>
      <button class="button" data-action="exit">退出</button>
    </div>
  </main>
  <script>
    const byId = id => document.getElementById(id);
    document.querySelectorAll('[data-action]').forEach(button => {
      button.addEventListener('click', () => { location.href = `startup-action://${button.dataset.action}`; });
    });
    let startupAppearance = null;
    const startedAt = Date.now();
    let activating = false;
    window.showActivation = status => {
      activating = true; document.body.classList.add('activating');
      byId('activationPanel').hidden = false;
      byId('fingerprint').value = status.machineId || '';
      byId('activationError').textContent = !status.publicKeyConfigured ? '安装包缺少授权公钥，请联系厂商' : !status.machineId ? '暂时无法读取本机指纹，请重试' : '';
      byId('activateButton').disabled = !status.publicKeyConfigured || !status.machineId;
      byId('activationCode').focus();
    };
    window.hideActivation = () => { activating = false; byId('activationPanel').hidden = true; document.body.classList.remove('activating'); };
    byId('copyFingerprint').addEventListener('click', async () => {
      const result = await window.startupActivation.copyFingerprint();
      byId('activationError').textContent = result.success ? '' : result.error;
      if (result.success) { byId('copyFingerprint').textContent = '已复制'; setTimeout(() => { byId('copyFingerprint').textContent = '复制指纹'; }, 1600); }
    });
    byId('activationForm').addEventListener('submit', async event => {
      event.preventDefault(); const button = byId('activateButton');
      if (button.disabled) return;
      button.disabled = true; button.textContent = '正在激活…'; byId('activationError').textContent = '';
      try {
        const result = await window.startupActivation.activate(byId('activationCode').value.trim());
        if (!result.success) throw new Error(result.error || '激活失败，请重试');
        button.textContent = '已激活'; byId('activationCode').value = '';
      } catch (error) { byId('activationError').textContent = error.message; button.disabled = false; button.textContent = '激活并继续'; }
    });
    setInterval(() => {
      byId('elapsed').textContent = `启动准备 · 已等待 ${Math.floor((Date.now() - startedAt) / 1000)} 秒`;
    }, 1000);
    window.configureStartup = config => {
      startupAppearance = config;
      document.documentElement.dataset.theme = config.theme === "dark" ? "dark" : "light";
      document.documentElement.style.setProperty('--startup-background', config.background);
      document.documentElement.style.setProperty('--startup-accent', config.accent);
      byId('subtitle').textContent = config.title;
      document.querySelector('.brand h1').textContent = config.kicker;
      document.body.classList.toggle('quiet', config.preset === 'quiet');
    };
    window.updateStartup = state => {
      document.body.className = `${state.status === 'error' ? 'error' : 'launch-status'}${startupAppearance?.preset === 'quiet' ? ' quiet' : ''}`;
      document.body.classList.toggle('activating', activating);
      document.title = state.status === 'error'
        ? '热处理数字孪生大屏 - 启动失败'
        : state.status === 'success' ? '热处理数字孪生大屏 - 启动完成' : '热处理数字孪生大屏 - 正在启动';
      byId('subtitle').textContent = state.status === 'error' ? 'STARTUP ERROR' : startupAppearance?.title || 'SYSTEM STARTUP';
      byId('title').textContent = state.title || '正在启动';
      byId('detail').textContent = state.detail || '';
      byId('error').textContent = state.error || '未知启动错误';
      byId('logPath').textContent = state.logPath ? `日志：${state.logPath}` : '';
    };
  </script>
</body>
</html>
