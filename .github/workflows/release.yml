name: Windows installer

on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: 'Optional: retry publishing an already verified main build; leave empty for a fresh installer'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.reuse.outputs.commit || github.sha }}
      run: ${{ steps.reuse.outputs.run || github.run_id }}
      artifact: ${{ steps.reuse.outputs.artifact || format('windows-installer-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - name: Only release main or a version tag already merged into main
        id: version
        env:
          RUNNER_ENABLED: ${{ vars.WINDOWS_RELEASE_RUNNER_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo 'Run this workflow on main or a vX.Y.Z tag.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main
          node tools/ci/check-release.cjs
          echo "tag=v$(node -p 'require("./desktop/package.json").version')" >> "$GITHUB_OUTPUT"
          if [[ "$RUNNER_ENABLED" != true ]]; then
            echo 'Windows runner is not enabled. Run tools/ci/setup-windows-runner.ps1; then set WINDOWS_RELEASE_RUNNER_ENABLED=true.' >&2
            exit 1
          fi

      - name: Verify previously built artifact provenance for publish-only retry
        id: reuse
        if: inputs.verified_run_id != '' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.verified_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo 'Invalid source run id'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/jobs?filter=latest&per_page=100" > source-jobs.json
          node tools/ci/reusable-release.cjs source-run.json source-jobs.json "$SOURCE_RUN"

  quality:
    needs: preflight
    uses: ./.github/workflows/quality.yml

  package:
    needs: [preflight, quality]
    if: inputs.verified_run_id == ''
    runs-on: [self-hosted, Windows, X64, digital-twin-release]
    timeout-minutes: 60
    steps:
      # Never let checkout's clean step delete Mono/runtime files underneath a
      # display, collector or leftover build still running from this workspace.
      - name: Refuse cleanup of an in-use build workspace
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\', '/') + '\'
          if ($workspace -eq [IO.Path]::GetPathRoot($workspace)) { throw 'Unsafe build workspace path' }
          $products = @('HeatTreatmentDigitalTwin.exe', 'HeatTreatmentAdminHost.exe', 'HeatTreatmentCollectorService.exe', 'HeatTreatmentCollectorCenter.exe', '热处理数字孪生大屏.exe', 'heat-treatment-digital-twin-desktop.exe')
          $tools = @('node.exe', 'Unity.exe', 'blender.exe', 'dotnet.exe')
          $busy = @(Get-CimInstance Win32_Process | Where-Object {
            $product = $_.Name -in $products
            $tool = $_.Name -in $tools
            if (-not $product -and -not $tool) { return $false }
            $exe = [string]$_.ExecutablePath
            $command = ([string]$_.CommandLine).Replace('/', '\')
            ($product -and -not $exe) -or
              ($exe -and $exe.Replace('/', '\').StartsWith($workspace, [StringComparison]::OrdinalIgnoreCase)) -or
              ($tool -and $command.IndexOf($workspace, [StringComparison]::OrdinalIgnoreCase) -ge 0)
          })
          if ($busy.Count) {
            $names = ($busy | ForEach-Object { "$($_.Name) (PID $($_.ProcessId))" }) -join ', '
            throw "Workspace is in use: $names. Checkout was not started. Move/close these workspace copies manually; this workflow will never terminate the running display or collector."
          }
      - uses: actions/checkout@v4
        with:
          lfs: true
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json
      # This dedicated machine is provisioned with .NET 8. Installing again
      # would try to write Program Files as a non-admin desktop build user.
      - name: Load and validate provisioned release environment
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: node tools/ci/release-environment.cjs
      - name: Check native build prerequisites
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: ./tools/ci/setup-windows-runner.ps1 -CheckOnly
      - uses: actions/cache@v4
        with:
          path: |
            unity-client/Library
            unity-client/Builds
            desktop/.cache
          key: release-windows-${{ runner.name }}-${{ hashFiles('unity-client/ProjectSettings/ProjectVersion.txt', '**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            release-windows-${{ runner.name }}-${{ hashFiles('unity-client/ProjectSettings/ProjectVersion.txt', '**/package-lock.json') }}-
            release-windows-${{ runner.name }}-
      - name: Build, verify first launch and restart, then package
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: ./生成安装包.ps1 -StarterTemplate -NoPause
      - name: Verify native overlay in the interactive Windows session
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: dotnet run --project tools/native-overlay-tests/NativeOverlayTests.csproj --configuration Release
      - name: Collect this build's verified installer
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: node tools/ci/collect-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ github.run_number }}
          path: output/ci-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - uses: actions/upload-artifact@v4
        id: build-logs
        if: always()
        # Diagnostic transport is not a release input. The mandatory installer
        # upload above and all build/smoke/native checks still fail closed.
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: windows-build-logs-${{ github.run_number }}
          path: |
            安装包/release-*/构建日志-*.txt
            安装包/release-*/build-timings.json
            output/packaged-project-bundle-mysql-*/result.json
            output/packaged-project-bundle-mysql-*/mysqld.log
            unity-client/Logs/desktop-package-build.log
          retention-days: 14
      - name: Report diagnostic upload failure
        if: always() && steps.build-logs.outcome == 'failure'
        shell: pwsh -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: Write-Warning 'Diagnostic log upload failed; runner logs remain in _diag. Build, installer upload and release verification are still mandatory.'

  publish-release:
    needs: [preflight, quality, package]
    if: always() && needs.preflight.result == 'success' && needs.quality.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && inputs.verified_run_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      # Checkout must precede download: its clean step removes untracked files.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact }}
          run-id: ${{ needs.preflight.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/verified-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify downloaded artifact before publishing
        env:
          BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
          BUILD_RUN: ${{ needs.preflight.outputs.run }}
        run: |
          node tools/ci/verify-release.cjs "$RUNNER_TEMP/verified-release" "$BUILD_COMMIT" "$BUILD_RUN"
          node tools/ci/portable-release.cjs "$RUNNER_TEMP/verified-release" "$BUILD_COMMIT" "$BUILD_RUN"
      - name: Upload all files, then publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          BUILD_COMMIT: ${{ needs.preflight.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag.json 2> tag-error.txt || {
            if ! grep -q 'HTTP 404' tag-error.txt; then cat tag-error.txt >&2; exit 1; fi
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$BUILD_COMMIT" > tag.json
          }
          TAG_SHA=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$TAG_SHA" = "$BUILD_COMMIT" || { echo 'Version tag belongs to another commit; bump the version instead of overwriting it.' >&2; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG · Windows x64" --notes "Windows x64：Setup.exe 为实时大屏和后台管理，不含 PLC 采集服务；仅接外部接口无需安装插件。需要自采时，另下载 Collector-Plugin.zip 并运行其中的安装采集插件.cmd。基于提交 $BUILD_COMMIT 自动构建，不含现场账号或 PLC 凭据。sha256.txt 用于完整性校验。"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/verified-release/"* --clobber
          gh release view "$RELEASE_TAG" --json assets > uploaded-assets.json
          node tools/ci/portable-release.cjs --uploaded "$RUNNER_TEMP/verified-release" uploaded-assets.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
