name: Shared model assets
on:
  push:
    branches: [main]
    paths: ['backend/assets/models/**', 'unity-client/Assets/Equipment/**', 'unity-client/Assets/StreamingAssets/**', 'model-assets.*.json', 'tools/model-assets*', '.gitattributes', '.github/workflows/model-assets.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/model-assets.test.cjs
      - run: node tools/model-assets.cjs --check
      - run: git lfs fsck
