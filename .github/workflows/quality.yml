name: digital-twin-quality

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend contract and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      mongodb:
        image: mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142
        env:
          MONGO_INITDB_ROOT_USERNAME: fixture_admin
          MONGO_INITDB_ROOT_PASSWORD: ci-disposable-only
        ports:
          - 27017/tcp
        options: >-
          --health-cmd "mongosh --quiet -u fixture_admin -p ci-disposable-only --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Reject generated files and high-confidence credential signatures
        run: node tools/repository-hygiene.cjs
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      # CAD geometry regressions import the frontend's three dependency.
      - run: npm --prefix ../frontend ci
      - run: npm ci
      - run: npm test
      - name: Native MongoDB authenticated read-only datasets
        run: node scripts/mongo-data-source-integration-test.cjs
        timeout-minutes: 3
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:${{ job.services.mongodb.ports[27017] }}/admin
          MONGODB_TEST_DISPOSABLE: 'true'
          MONGODB_TEST_ADMIN_USER: fixture_admin
          MONGODB_TEST_ADMIN_PASSWORD: ci-disposable-only
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-logs
          path: |
            output/quality-suite-*/result.json
            output/quality-suite-*/*.log
            output/mongo-data-source-*/result.json
            output/mongo-data-source-*/failure.json
          retention-days: 7

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      # WebSocket integration tests import the backend's ws dependency.
      - run: npm --prefix ../backend ci
      - run: npm ci
      - run: npm test
      - name: HTTP template mapping end-to-end
        run: node scripts/template-http-e2e.mjs
        timeout-minutes: 3
      - name: Pit part datasets preserve custom widgets and geometry
        run: node ../tools/pit-part-demo-test.cjs
        timeout-minutes: 3
      - run: npm run build
      - name: Upload HTTP mapping evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-template-mapping-evidence
          path: |
            output/template-http-e2e-*/report.json
            output/template-http-e2e-*/failure.json
            output/template-http-e2e-*/backend.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-production
          path: frontend/dist
          retention-days: 7

  desktop:
    name: Windows desktop and native runtime regressions
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            desktop/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm --prefix backend ci
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npm --prefix desktop run test:logs
      - run: npm --prefix desktop run test:processes
      - run: npm --prefix desktop run test:resources
      - run: node --test tools/ci/collect-release.test.cjs
      - run: node tools/ci/check-release.cjs
      - run: dotnet run --project tools/native-runtime-tests/NativeRuntimeTests.csproj --configuration Release --artifacts-path output/native-runtime-tests
      - run: dotnet run --project tools/native-inspection-tests/NativeInspectionTests.csproj --configuration Release --artifacts-path output/native-inspection-tests
      # Actual DirectComposition requires an interactive desktop; run it on the
      # dedicated release host, while keeping compilation in hosted PR checks.
      - run: dotnet build tools/native-overlay-tests/NativeOverlayTests.csproj --configuration Release --artifacts-path output/native-overlay-tests
      - run: dotnet build native-admin-host/HeatTreatmentAdminHost.csproj --configuration Release --artifacts-path output/native-host

  mock-server:
    name: Isolated MQTT simulator regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mock-server
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mock-server/package-lock.json
      - run: npm ci
      - run: npm test
